name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # issue #27 / ADR 0001：设置白名单生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，最早门禁，先于依赖安装）
      - name: Check Settings Rules drift
        run: npm run gen:settings && git diff --exit-code -- src/generated/settings-rules.ts worker/src/generated/settings-rules.ts

      # issue #28 / ADR 0002：安全头生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，紧随设置白名单漂移断言）
      - name: Check Security Headers drift
        run: npm run gen:headers && git diff --exit-code -- public/_headers

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: worker

      - name: Test Worker
        run: npm run test
        working-directory: worker

      - name: Check Frontend Types
        run: npm run check

      - name: Test Frontend
        run: npm test

      # P3：Playwright 不入 package.json；CI 固定回归验证过的版本。
      - name: Install Playwright Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_VERSION: "1.64.1"
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      # P3：文章 SSR 回归在部署前跑；两条导航回归仍手动，避免首版 CI 过重。
      - name: Test Article SSR (Playwright)
        timeout-minutes: 10
        env:
          ARTICLE_API_ORIGIN: http://127.0.0.1:4322
          # 避免 dev 启动时为 sitemap 访问真实 API；失败会回退为空列表。
          SITEMAP_API_BASE: http://127.0.0.1:9
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/astro-dev.log"
          ./node_modules/.bin/astro dev --port 4321 >"$LOG" 2>&1 &
          DEV_PID=$!
          cleanup() {
            pkill -P "$DEV_PID" 2>/dev/null || true
            kill "$DEV_PID" 2>/dev/null || true
            wait "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:4321/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Astro dev server did not become ready within 60s." >&2
            tail -n 200 "$LOG" >&2
            exit 1
          fi

          if ! node scripts/verify-article-ssr.mjs; then
            echo "Article SSR regression failed; Astro dev log:" >&2
            tail -n 200 "$LOG" >&2
            exit 1
          fi

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          nodeVersion: "22"
          command: pages deploy dist --project-name=blog-website

      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for Git integration
        run: sleep 120

      - name: Re-deploy Pages (overwrite Git integration)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          nodeVersion: "22"
          command: pages deploy dist --project-name=blog-website

      - name: Re-deploy Worker (overwrite Git integration)
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
