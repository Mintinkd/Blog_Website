name: 部署博客

on:
  push:
    branches: [main]
  workflow_dispatch:

# 硬编码配置迁移：站点 / Worker / Pages / D1 / KV / R2 的可调参数统一收敛到
# GitHub Actions variables（非敏感）与 secrets（敏感）。所有 vars 都带默认值，
# 仓库未配置时行为与迁移前完全一致；改值只需在 Settings → Secrets and variables
# → Actions 里改，不必改代码。R2 访问密钥只通过 secrets 注入，不落仓库。
env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  PLAYWRIGHT_VERSION: ${{ vars.PLAYWRIGHT_VERSION || '1.64.1' }}

  # 站点 / API
  # 兼容历史配置：SITE_URL 曾经以 Secret 形式存在，仍读取它作为次级回退。
  SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://blog.zenfishlog.dpdns.org' }}
  PUBLIC_SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://blog.zenfishlog.dpdns.org' }}
  WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN || 'https://blog-api.zen-13467.workers.dev' }}
  PUBLIC_WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN || 'https://blog-api.zen-13467.workers.dev' }}
  SITEMAP_API_BASE: ${{ vars.SITEMAP_API_BASE }}
  SITEMAP_PAGE_SIZE: ${{ vars.SITEMAP_PAGE_SIZE || '50' }}

  # Cloudflare 资源标识（部署标识，不是机密；均可在仓库变量里覆盖）
  PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'blog-website' }}
  WORKER_NAME: ${{ vars.WORKER_NAME || 'blog-api' }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '5c759ce7-82e0-4205-8d01-fea18db55cd7' }}
  D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'blog-db' }}
  KV_MEDIA_ID: ${{ vars.KV_MEDIA_ID || 'c4f354b6c61e43e798a679fb6733edd8' }}
  KV_EDIT_LOCK_ID: ${{ vars.KV_EDIT_LOCK_ID || '8a63eee2d516410d8e6e5ec7d420a0b1' }}
  KV_RATE_LIMIT_ID: ${{ vars.KV_RATE_LIMIT_ID || 'e18fbfafedf048a380e6fe4e2a6f96d6' }}

  # R2 媒体桶（新上传写 R2；桶名由 render-worker-config 注入 wrangler 配置）
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'blog-media' }}
  R2_REGION: ${{ vars.R2_REGION || 'auto' }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 部署就绪轮询
  DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://blog-website-page.pages.dev' }}
  DEPLOY_TIMEOUT_SEC: ${{ vars.DEPLOY_TIMEOUT_SEC || '180' }}
  DEPLOY_INTERVAL_SEC: ${{ vars.DEPLOY_INTERVAL_SEC || '5' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      # secrets 不能直接出现在 if 里；在 job 级映射成布尔标记，供 R2 secret 同步步骤判断。
      HAS_R2_CREDENTIALS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # issue #27 / ADR 0001：设置白名单生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，最早门禁，先于依赖安装）
      - name: 检查设置规则漂移
        run: npm run gen:settings && git diff --exit-code -- src/generated/settings-rules.ts worker/src/generated/settings-rules.ts

      # issue #28 / ADR 0002：安全头生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，紧随设置白名单漂移断言）
      - name: 检查安全响应头漂移
        run: npm run gen:headers && git diff --exit-code -- public/_headers

      # issue #85 / H4：CORS 白名单双端生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，Worker/Pages 共用单一描述符）
      - name: 检查 CORS 来源漂移
        run: npm run gen:cors && git diff --exit-code -- src/generated/cors-origins.ts worker/src/generated/cors-origins.ts

      # issue #92 / M6 + #99 / M19：富文本白名单单一源生成物不得漂移
      - name: 检查富文本策略漂移
        run: npm run gen:rich-text && git diff --exit-code -- worker/src/generated/rich-text-policy.ts

      - name: 安装根包依赖
        run: npm ci

      - name: 安装 Worker 依赖
        run: npm ci
        working-directory: worker

      - name: Worker 类型检查
        run: npm run typecheck
        working-directory: worker

      - name: 测试 Worker
        run: npm run test
        working-directory: worker

      - name: 前端类型检查
        run: npm run check

      # issue #102 / L2：ESLint 门禁（死代码 / 未使用变量 / 重复定义为 error 级）。
      # 根配置同时覆盖根包与 worker/src、worker/tests，故一条命令即可。
      - name: 代码静态检查
        run: npm run lint

      - name: 测试前端
        run: npm test

      # P3：Playwright 不入 package.json；CI 固定回归验证过的版本。
      - name: 安装 Playwright Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      # 文章 SSR / 编辑器端到端 / 后台响应式 / 观感，失败即阻断部署。
      # 两条导航回归仍手动。编辑器脚本自己拉起有状态 mock（端口 4322），
      # 与 ARTICLE_API_ORIGIN 指向同一进程，PUT 与 SSR GET 共用内存数据。
      - name: 文章 SSR + 编辑器 + 后台回归（Playwright）
        timeout-minutes: 15
        env:
          ARTICLE_API_ORIGIN: http://127.0.0.1:4322
          # 避免 dev 启动时为 sitemap 访问真实 API；失败会回退为空列表。
          SITEMAP_API_BASE: http://127.0.0.1:9
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/astro-dev.log"
          ./node_modules/.bin/astro dev --port 4321 >"$LOG" 2>&1 &
          DEV_PID=$!
          cleanup() {
            pkill -P "$DEV_PID" 2>/dev/null || true
            kill "$DEV_PID" 2>/dev/null || true
            wait "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:4321/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Astro dev server did not become ready within 60s." >&2
            tail -n 200 "$LOG" >&2
            exit 1
          fi

          if ! node scripts/verify-article-ssr.mjs; then
            echo "Article SSR regression failed; Astro dev log:" >&2
            tail -n 200 "$LOG" >&2
            exit 1
          fi

          # T7 #68：编辑器端到端回归（§10.3 九条检查单拆成 12 个独立场景：
          # 安全 / lossy 语料、保存只含 Markdown、
          # 保存后回读 SSR、未保存保护、失败态、草稿、锁冲突、响应式、控制台）。
          # 脚本自己拉起 / 关闭有状态 mock；失败时打印 dev server 日志便于定位。
          if ! node scripts/verify-article-editor.mjs; then
            echo "Article editor regression failed; Astro dev log:" >&2
            tail -n 200 "$LOG" >&2
            exit 1
          fi

          # 后台 6 张数据表在手机上卡片化；同时守住统计/抓取/外观页无横向溢出。
          # T7 起编辑器遮罩也纳入 280 / 375px 检查。
          node scripts/verify-admin-responsive.mjs

          # T6 #67 的编辑器响应式 / 交互回归此前仅手动，T7 一并纳入门禁。
          node scripts/verify-editor-responsive.mjs

          # 页面观感友好度：实测对比度 / 文案分行 / 间距 / 选中态 / 溢出 / 焦点环，
          # 亮暗主题 × 375/1280 视口；失败输出带规则 ID 与源码定位的问题清单。
          node scripts/verify-visual-friendliness.mjs

      - name: 构建 Astro 站点
        run: npm run build

      # issue #113 / L4：SSR 一致性 CI 断言——构建后检查产物结构（页面存在 / script 指纹 / CSP 收紧），
      # 故意改一个字节应红；纯本地文件检查，排除远端噪声。
      - name: SSR 一致性断言
        run: node scripts/verify-ssr-consistency.mjs

      # 供 D1 迁移 / Worker 部署共用：把 vars 里的资源标识与 R2 桶名渲染进
      # worker/wrangler.deploy.jsonc（生成物，不入 git）。未配置的变量保留仓库默认值。
      - name: 渲染 Worker 部署配置
        run: node scripts/render-worker-config.mjs

      # D1 增量迁移（issue：CI/CD 自动迁移）：两个文件都是 IF NOT EXISTS 幂等，
      # 每次 push 安全重放；结构性历史迁移走 migrations/ 手动 apply（issue #94），
      # 不在此重放。全量 schema.sql 虽已幂等（#94），仍不作为 CI 迁移源。
      # 放在所有门禁之后、部署之前：测试失败就不碰生产库。
      - name: 执行 D1 迁移
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --yes --config=wrangler.deploy.jsonc --file=./schema-tier0-incremental.sql
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --yes --config=wrangler.deploy.jsonc --file=./schema-m22-incremental.sql
          node ../scripts/migrate-reading-time.mjs

      # 迁移命令返回 0 不等于对象真的建出来（表名错/前置列缺失会跳过），
      # 用 sqlite_master 核对 3 表 + 5 索引，缺一项即红。
      - name: 校验 D1 迁移
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-d1-migrations.mjs

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT_NAME }}

      # R2 桶不存在时创建；已存在则忽略。需要 token 具备 R2 编辑权限。
      - name: 确保 R2 存储桶存在
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler r2 bucket create "$R2_BUCKET_NAME" 2>&1 | tee "$RUNNER_TEMP/r2-create.log" || {
            grep -qi "already exists\|already owned" "$RUNNER_TEMP/r2-create.log"
          }

      - name: 部署 Worker
        run: npx wrangler deploy --config=wrangler.deploy.jsonc
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 可选：把 R2 S3 兼容访问密钥同步为 Worker secret（迁移脚本 / 外部 S3 工具用）。
      # 未配置 secrets 时整步跳过，不影响以 R2 绑定为主的运行时读写。
      # 放在 Deploy Worker 之后：secret put 要求 Worker 已存在（首次部署时亦可用）。
      # secrets 不能直接写进 if，故先映射到 step env 再判断。
      - name: 同步 R2 凭据到 Worker
        if: ${{ env.HAS_R2_CREDENTIALS == 'true' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID --config=wrangler.deploy.jsonc
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY --config=wrangler.deploy.jsonc
          printf '%s' "$R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID --config=wrangler.deploy.jsonc
          printf '%s' "$R2_REGION" | npx wrangler secret put R2_REGION --config=wrangler.deploy.jsonc
          if [ -n "$R2_ENDPOINT" ]; then
            printf '%s' "$R2_ENDPOINT" | npx wrangler secret put R2_ENDPOINT --config=wrangler.deploy.jsonc
          fi

      # issue #106 / L8：部署后轮询线上就绪，替代旧的「固定 sleep + 二次覆盖部署」。
      # 两条探针覆盖两条链路：`/`（Pages 产物）与 `/api/v1/health`（API Worker，
      # 要求 200 且 status=ok、db 非 error）。就绪即返回；超时打印每条的末次状态并非零退出。
      - name: 等待部署就绪
        env:
          # 探针打 Pages 生产别名，而不是自定义域：zone 的边缘安全规则会把
          # GitHub Actions 的出网 IP 判成 bot（自定义域恒 403，实测 2026-11-17
          # run 43987529351），那是边缘拦截、不是部署没就绪，gate 会永久假红。
          # 别名同样覆盖两条链路：`/` 验 Pages 产物，`/api/v1/health` 走同源
          # 代理验 Worker（含 D1 / KV / R2 绑定）。自定义域的可达性仍需人工/Dashboard
          # 侧放行 CI 出口 IP，属 #106 的未闭环项（见 README 部署段）。
          DEPLOY_BASE_URL: ${{ env.DEPLOY_BASE_URL }}
          DEPLOY_TIMEOUT_SEC: ${{ env.DEPLOY_TIMEOUT_SEC }}
          DEPLOY_INTERVAL_SEC: ${{ env.DEPLOY_INTERVAL_SEC }}
        run: node scripts/wait-for-deploy.mjs

      # L8：原「sleep 120 + 二次覆盖部署」已删除。README「自动部署」要求关闭
      # Pages Git 自动部署、统一由 Actions 管理；若 Git 集成仍开着，上面的单次
      # deploy 后可能再被 Git 集成产物覆盖——这种情况应在 Dashboard 关闭集成，
      # 而不是用固定等待 + 二次部署掩盖（部署时长翻倍且依赖隐式时序）。
      # 该要求仓库侧无法自动验证，人工核查清单见 README「部署通道人工核查清单」。
