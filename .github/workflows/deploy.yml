name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # issue #27 / ADR 0001：设置白名单生成物不得漂移——
      # 重新生成后 diff 非空即红（零依赖脚本，最早门禁，先于依赖安装）
      - name: Check Settings Rules drift
        run: npm run gen:settings && git diff --exit-code -- src/generated/settings-rules.ts worker/src/generated/settings-rules.ts

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: worker

      - name: Test Worker
        run: npm run test
        working-directory: worker

      - name: Check Frontend Types
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          nodeVersion: "22"
          command: pages deploy dist --project-name=blog-website-page

      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for Git integration
        run: sleep 120

      - name: Re-deploy Pages (overwrite Git integration)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          nodeVersion: "22"
          command: pages deploy dist --project-name=blog-website-page

      - name: Re-deploy Worker (overwrite Git integration)
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
